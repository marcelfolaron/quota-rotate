name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        # A config dir of its own: no login, no settings, nothing of the runner's user.
        run: |
          npm install -g @anthropic-ai/claude-code
          mkdir -p "$RUNNER_TEMP/claude-config"
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config" >> "$GITHUB_ENV"
          claude --version
      - name: Validate, mod tests, shell tests
        run: bash tests/run.sh
